name: Deploy Core Lambda Layer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Run Alembic Migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured"
            exit 1
          fi

      - name: Check current migration
        run: |
          python -m alembic current

      - name: Run database migrations
        run: |
          python -m alembic upgrade head

      - name: Verify migration
        run: |
          python -m alembic current
          python -m alembic check

  deploy:
    name: Deploy Lambda Layer
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Build Lambda Layer
        run: |
          rm -rf layer
          rm -f shop-core-layer.zip

          mkdir -p layer/python

          python -m pip install . \
            --target layer/python \
            --upgrade

      - name: Show Layer content
        run: |
          ls -la layer/python
          du -sh layer/python

      - name: Create Layer ZIP
        run: |
          cd layer
          zip -qr ../shop-core-layer.zip python

      - name: Publish Lambda Layer
        run: |
          aws lambda publish-layer-version \
            --layer-name shop-core \
            --description "Shop core - commit ${{ github.sha }}" \
            --zip-file fileb://shop-core-layer.zip \
            --compatible-runtimes python3.14

 